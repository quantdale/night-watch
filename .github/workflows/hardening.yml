name: Nightwatch hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  local-hardening:
    name: Executable quality gate
    runs-on: ubuntu-latest
    # The unified gate is serial and includes npm ci, the Phase 9–23
    # compatibility cone, owner provenance, and the synthetic campaign. This
    # is a bounded budget, not a retry or a product-environment allowance.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Execute authoritative quality gate
        run: npm run gate:ci

# This workflow is intentionally an environment bootstrap plus the shared
# repository-owned gate. The gate itself is offline, serial, fail-closed, and
# emits only safe bounded receipts. It never runs authenticated browsers,
# campaign:real, auth:capture, DEV/NEXT/production targets, databases,
# infrastructure, external publication, or private evidence uploads.
